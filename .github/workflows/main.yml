name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 3600

    steps:
      - name: Install build dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git curl wget zip unzip tar \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            libncurses5-dev libncurses-dev \
            dwarves \
            python3 python3-pip \
            ccache \
            clang llvm lld \
            lz4 \
            xz-utils \
            rsync \
            file \
            make \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pre-build cleanup (folders only)
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Deleting build.log"
          rm -rf build.log

          echo "Deleting build-related folders"
          rm -rf clang AnyKernel3 susfs4ksu KernelSU-Next

      - name: Run build script
        run: |
          cd "$GITHUB_WORKSPACE"
          bash build.sh

      - name: Commit and push ONLY ZIP output
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"

          echo "Cleaning git junk (DO NOT push out/)"
          find . -type d -name ".git" -not -path "./.git" -exec rm -rf {} +

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # ONLY push flashable zips
          git add output/*.zip

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Kernel build artifacts (zip only)"
          git push origin HEAD:${{ github.ref_name }}
